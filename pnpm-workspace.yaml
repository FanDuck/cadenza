packages:
  - packages/*
  - apps/*

# pnpm >= 10 refuses to run install scripts unless they are allow-listed.
# Electron downloads its Chromium runtime in a postinstall script; it is the only
# dependency in this repo that needs one.
#
# pnpm 10 used `onlyBuiltDependencies`; pnpm 11 replaced it with the `allowBuilds`
# map. Both are listed so the repo installs cleanly with either version.
allowBuilds:
  electron: true

onlyBuiltDependencies:
  - electron
