packages:
  - packages/*
  - apps/*

# pnpm >= 10 refuses to run install scripts unless they are allow-listed.
#
# - electron: downloads the Chromium runtime in its postinstall script.
# - electron-winstaller: only needed for Squirrel installers, which this project
#   does not use (electron-builder builds an NSIS installer). Explicitly disabled
#   so `pnpm install` does not fail with ERR_PNPM_IGNORED_BUILDS.
#
# pnpm 10 used `onlyBuiltDependencies`; pnpm 11 replaced it with the `allowBuilds`
# map. Both are listed so the repo installs cleanly with either version.
allowBuilds:
  electron: true
  electron-winstaller: false

onlyBuiltDependencies:
  - electron
