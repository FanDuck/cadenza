# electron-builder configuration.
#
#   pnpm package        assemble release/app (see scripts/package-app.mjs)
#   pnpm dist           build an NSIS installer + a portable .exe in release/dist
#
# The app is unsigned: Windows SmartScreen will warn on first run until a code
# signing certificate is configured (see docs/RELEASING.md).
appId: dev.fanduck.cadenza
productName: Cadenza
copyright: Copyright (c) 2026 FanDuck

# Paths are resolved from the repository root, which is where `pnpm dist` runs.
directories:
  app: release/app
  output: release/dist
  buildResources: apps/desktop/resources

# Resolve Electron from the devDependency instead of looking inside the app dir,
# which only contains the compiled output.
electronVersion: 33.4.11
asar: true
asarUnpack:
  - "apps/desktop/resources/**"

files:
  - "**/*"
  - "!**/*.map"
  - "!**/node_modules/**"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: apps/desktop/resources/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cadenza
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
