name: Release

# Building the installer needs to run the NSIS bootstrap (electron-builder builds
# the uninstaller by executing the intermediate installer), which is not possible
# in every environment. A GitHub Windows runner can do it, so releases are built
# here instead of on a developer machine.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build installer, portable exe and zip
        run: pnpm dist
        env:
          # No certificate is configured; skip the signing hooks explicitly.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release/dist -File | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cadenza-windows
          path: |
            release/dist/*.exe
            release/dist/*.zip
            release/dist/*.blockmap
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/dist/*.exe
            release/dist/*.zip
