name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No `version` here on purpose: pnpm/action-setup reads the exact version
      # from the `packageManager` field in package.json. Specifying both makes
      # the action fail with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24 runs the .ts test files directly (type stripping), no build step
          # required for the test files themselves.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # After the build on purpose: `apps/desktop` imports the workspace packages
      # through their package.json `types` entry (packages/*/dist/index.d.ts).
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check renderer bundle wiring
        run: node scripts/check-bundle.mjs

      - name: Check documentation links
        run: node scripts/check-links.mjs

      - name: Check text encoding
        run: node scripts/check-encoding.mjs

      - name: Verify renderer artifacts
        shell: pwsh
        run: |
          $required = @(
            "packages/core/dist/index.js",
            "packages/ui/dist/index.js",
            "apps/desktop/dist/main/index.js",
            "apps/desktop/dist/renderer/index.html",
            "apps/desktop/dist/renderer/main.js"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "missing build output: $missing"; exit 1 }
          Write-Host "all expected build artifacts exist"
